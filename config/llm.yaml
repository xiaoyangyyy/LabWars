# LabWars LLM 配置 — 智算 OpenAI 兼容接口
# API Key 通过环境变量 OPENAI_API_KEY 注入，勿写入此文件

provider: openai
base_url: https://ai.azya.top/v1
model: qwen3.5
temperature: 0.85
top_p: 0.92
max_tokens: 1024
api_key_env: OPENAI_API_KEY
request_delay_sec: 3.0
max_retries: 12

